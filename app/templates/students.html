{% extends 'base.html' %}

{% block content %}
{% if students %}
    {% for student in students %}
    <div>
        <a href="{{ url_for('main.specific_student', id=student.id) }}">{{student.username}}</a><br>

        data iscrizione: {{ student.data_iscrizione }}
    </div>
    {% endfor %}
{% else %}
    <h1>student non trovato 404</h1>
{%endif%}
{% endblock %}
