{% extends 'base.html' %}

{% block content %}
<h1>Notes for <i>{{ notes[0].nome_materia}}</i></h1>

{% for note in notes %}
    <div>
        <a href="{{ url_for('main.specific_student', id=note.id) }}">{{note.username}}</a><br><br>
        {{ note.title }}<br>
        {{ note.data_upload }}<br>
    </div>

{% endfor %}

{% endblock %}
