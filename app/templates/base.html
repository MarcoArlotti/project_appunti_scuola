        /* ===== DARK MODE MODERNO ===== */
.center-block {
    text-align: justify; /* Centra il testo all'interno del blocco */
    margin-left: auto;
    margin-right: auto;
    width: 30%; /* Puoi modificare la larghezza come preferisci */
}

.center-block2 {

    margin-left: auto;
    margin-right: auto;

}


.viewport-img, img{
  width: 100vw;  /* Exactly 50% of the browser's width */
  height: auto;
}

.navbar{
    position: sticky; /* oppure fixed */
    top: 0;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 16px 40px;

    background: #4e004c;
    border-bottom: 1px solid #ffffff;
    border-top: 1px solid #ffffff;

    z-index: 1000;
}

.logo{
    font-size: 22px;
    font-weight: bold;
    color: white;
}

.navbar nav{
    display: flex;
    gap: 25px;

}

.navbar a{
    color: #b6bcc8;
    text-decoration: none;
    transition: 0.2s;
}

.navbar a:hover{
    color: #5b8cff;
}
:root{
    --bg-main: #000000;
    --bg-secondary: #1a1d24;
    --bg-card: #20242d;

    --text-main: #f5f7fa;
    --text-secondary: #b6bcc8;

    --primary: #5b8cff;
    --primary-hover: #7aa2ff;

    --border: #2c313c;
    --shadow: rgba(0,0,0,0.4);
}

/* Sfondo generale */
body{
    background-color: var(--bg-main);
    color: var(--text-main);
}

/* Header / navbar */
header,
nav{
    background-color: var(--bg-secondary);
    color: var(--text-main);
    border-bottom: 2px solid var(--border);
}

/* Footer */
footer{
    background-color: var(--bg-secondary);
    color: #c800ff;;
    border-top: 2px solid var(--border);
}

/* Sezioni / card */
section,
.card,
.container,
.box{
    background-color: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border);
    box-shadow: 0 4px 12px var(--shadow);
    border-radius: 12px;
}

/* Titoli */
h1, h2, h3, h4, h5, h6{
    color: rgb(129, 0, 129);
}

hr {
    border-color: rgba(255, 0, 187, 0.216);
}
/* Testi */
p,
span,
label,
li{
    color: var(--text-secondary);
}

/* Link */
a{
    color: var(--primary);
    transition: 0.2s ease;
}

a:hover{
    color: var(--primary-hover);
}

/* Pulsanti */
button,
.btn{
    background-color: var(--primary);
    color: rgb(255, 221, 0);
    border: red;
    border-radius: 8px;
    padding: 10px 16px;
    transition: 0.2s ease;
}

button:hover,
.btn:hover{
    background-color: var(--primary-hover);
}

/* Input */
input,
textarea,
select{
    background-color: #161920;
    color: var(--text-main);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
}

input:focus,
textarea:focus,
select:focus{
    outline: none;
    color: solid #ff0000;;
}
input[type="button"], button{
  background-color: rgb(89, 0, 109);
  color: rgb(255, 255, 255);
}

/* Tabelle */
table{
    background-color: var(--bg-card);
    color: var(--text-main);
}

th{
    background-color: var(--bg-secondary);
}

td, th{
    border: 1px solid var(--border);
    padding: 12px;
}

/* Scrollbar moderna */
::-webkit-scrollbar{
    width: 10px;
}

::-webkit-scrollbar-track{
    background: var(--bg-main);
}

::-webkit-scrollbar-thumb{
    background: #3a4250;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover{
    background: #4c5668;
}
